[package]
name = "amusic_desktop"
version = "1.0.0"
description = "AMusic Desktop"
authors = ["AMusic"]
edition = "2021"

[lib]
name = "amusic_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
