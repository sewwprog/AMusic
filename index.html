<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TGify - Музика у стилі Telegram</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tg: {
                            bg: '#0e1621',       // Головний фон (як фон чату в ТГ)
                            panel: '#17212b',    // Сайдбар та плеєр
                            card: '#182533',     // Картка треку
                            cardHover: '#202b36',// Картка при наведенні
                            active: '#2b5278',   // Активний елемент
                            blue: '#5288c1',     // Основний синій ТГ
                            accent: '#6ab3f3',   // Яскравий блакитний ТГ (замість зеленого в Спотіфай)
                            text: '#f5f5f5',     // Білий текст
                            muted: '#7f91a4'     // Сіро-синій текст
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0e1621; }
        ::-webkit-scrollbar-thumb { background: #202b36; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #5288c1; }
        
        .playing-glow {
            box-shadow: 0 0 15px rgba(106, 179, 243, 0.4);
            border: 1px solid rgba(106, 179, 243, 0.5);
        }
    </style>
</head>
<body class="bg-tg-bg text-tg-text h-screen flex flex-col overflow-hidden font-sans select-none">

    <!-- ВЕРХНЯ ЧАСТИНА (САЙДБАР + КОНТЕНТ ЯК У SPOTIFY) -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- ЛІВИЙ САЙДБАР -->
        <aside class="w-64 bg-tg-panel flex flex-col border-r border-black/30 z-10">
            <!-- Логотип -->
            <div class="p-6 flex items-center gap-3 text-2xl font-bold text-tg-accent">
                <i class="fa-brands fa-telegram text-3xl"></i>
                <span>TG Music</span>
            </div>

            <!-- Головне меню -->
            <nav class="px-3 flex flex-col gap-1">
                <button onclick="loadStarterPack()" id="nav-home" class="flex items-center gap-4 px-4 py-3 rounded-lg text-sm font-semibold bg-tg-active text-white transition">
                    <i class="fa-solid fa-fire text-lg w-5 text-tg-accent"></i> Головна (52 & Хіти)
                </button>
                <button onclick="quickSearch('ALBLAK 52')" class="flex items-center gap-4 px-4 py-2.5 rounded-lg text-sm font-medium text-tg-muted hover:text-white hover:bg-tg-cardHover transition">
                    <i class="fa-solid fa-compact-disc text-lg w-5"></i> ALBLAK 52
                </button>
                <button onclick="quickSearch('FRIENDLY THUG 52 NGG')" class="flex items-center gap-4 px-4 py-2.5 rounded-lg text-sm font-medium text-tg-muted hover:text-white hover:bg-tg-cardHover transition">
                    <i class="fa-solid fa-compact-disc text-lg w-5"></i> Friendly Thug 52
                </button>
            </nav>

            <hr class="border-black/30 my-4 mx-4">

            <!-- Заголовок Плейлістів -->
            <div class="px-6 mb-2 flex items-center justify-between">
                <span class="text-xs font-bold uppercase tracking-wider text-tg-muted">Твої Плейлісти</span>
                <button onclick="createNewPlaylist()" title="Створити плейліст" class="text-tg-muted hover:text-tg-accent transition">
                    <i class="fa-solid fa-plus text-base"></i>
                </button>
            </div>

            <!-- Список користувацьких плейлістів -->
            <div id="playlists-list" class="flex-1 overflow-y-auto px-3 flex flex-col gap-1">
                <!-- Генерується через JS -->
            </div>

            <!-- Віконце YouTube плеєра (Вимога API для безкоштовного стрімінгу) -->
            <div class="p-3 m-3 bg-tg-card rounded-xl border border-white/5 flex items-center gap-3">
                <div class="w-16 h-12 rounded-lg overflow-hidden bg-black flex-shrink-0">
                    <div id="youtube-player" class="w-full h-full pointer-events-none"></div>
                </div>
                <div class="text-[11px] text-tg-muted leading-tight">
                    <span class="text-tg-accent font-bold">Full Audio</span><br>
                    Прямий ефір
                </div>
            </div>
        </aside>

        <!-- ГОЛОВНИЙ ЕКРАН (СІТКА SPOTIFY) -->
        <main class="flex-1 flex flex-col overflow-hidden bg-tg-bg relative">
            
            <!-- Шапка з пошуком -->
            <header class="h-20 bg-tg-panel/80 backdrop-blur-md px-8 flex items-center justify-between sticky top-0 z-10 border-b border-black/20">
                <div class="relative w-full max-w-md">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-tg-muted"></i>
                    <input type="text" id="search-input" placeholder="Який трек увімкнути? (напр. ALBLAK 52)..." 
                        class="w-full bg-tg-card text-white text-sm rounded-full py-3 pl-11 pr-4 focus:outline-none focus:ring-2 focus:ring-tg-accent transition placeholder-tg-muted"
                        onkeypress="if(event.key === 'Enter') searchMusic()">
                </div>
                <button onclick="searchMusic()" class="ml-4 bg-tg-blue hover:bg-tg-accent text-white font-semibold py-2.5 px-6 rounded-full text-sm transition shadow-lg">
                    Знайти
                </button>
            </header>

            <!-- Контент з картками -->
            <div class="flex-1 overflow-y-auto p-8">
                <div class="flex items-baseline justify-between mb-6">
                    <h1 id="page-title" class="text-2xl font-bold">🔥 ALBLAK 52 & Свіжі Хіти</h1>
                    <span id="tracks-count" class="text-xs text-tg-muted"></span>
                </div>

                <!-- Індикатор завантаження -->
                <div id="loader" class="hidden flex flex-col items-center justify-center py-24 gap-3">
                    <i class="fa-solid fa-circle-notch fa-spin text-4xl text-tg-accent"></i>
                    <p class="text-sm text-tg-muted">Шукаємо повні версії треків...</p>
                </div>

                <!-- Сітка карток (Як у Spotify) -->
                <div id="tracks-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-5 pb-12">
                    <!-- Картки додаються сюди -->
                </div>
            </div>
        </main>
    </div>

    <!-- НИЖНІЙ ПЛЕЄР (РОЗСТАНОВКА SPOTIFY, КОЛЬОРИ TELEGRAM) -->
    <footer class="h-24 bg-tg-panel border-t border-black/40 px-6 flex items-center justify-between z-20">
        
        <!-- Ліва частина: Поточний трек -->
        <div class="flex items-center gap-4 w-1/3">
            <img id="player-art" src="https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg" class="w-14 h-14 rounded-lg object-cover bg-tg-card shadow-md">
            <div class="overflow-hidden">
                <div id="player-title" class="font-bold text-sm truncate text-white">Оберіть трек</div>
                <div id="player-artist" class="text-xs text-tg-accent truncate mt-0.5">TG Music</div>
            </div>
        </div>

        <!-- Центральна частина: Кнопки + Прогрес -->
        <div class="flex flex-col items-center w-1/3 max-w-lg">
            <div class="flex items-center gap-6 mb-2">
                <button onclick="prevTrack()" class="text-tg-muted hover:text-white text-lg transition"><i class="fa-solid fa-backward-step"></i></button>
                <button onclick="togglePlay()" id="play-btn" class="w-10 h-10 bg-tg-accent text-tg-bg rounded-full flex items-center justify-center hover:scale-105 hover:bg-white transition shadow-lg">
                    <i class="fa-solid fa-play ml-0.5 text-base"></i>
                </button>
                <button onclick="nextTrack()" class="text-tg-muted hover:text-white text-lg transition"><i class="fa-solid fa-forward-step"></i></button>
            </div>
            <div class="w-full flex items-center gap-3 text-xs text-tg-muted">
                <span id="current-time" class="w-8 text-right">0:00</span>
                <input type="range" id="progress-bar" value="0" max="100" class="flex-1 accent-tg-accent h-1 bg-tg-card rounded-lg cursor-pointer" oninput="seekTrack()">
                <span id="duration-time" class="w-8">0:00</span>
            </div>
        </div>

        <!-- Права частина: Гучність -->
        <div class="flex items-center justify-end gap-3 w-1/3">
            <i class="fa-solid fa-volume-high text-tg-muted text-sm"></i>
            <input type="range" id="volume-bar" value="100" max="100" class="w-28 accent-tg-accent h-1 bg-tg-card rounded-lg cursor-pointer" oninput="changeVolume()">
        </div>
    </footer>

    <!-- МОДАЛЬНЕ ВІКНО: ДОДАТИ В ПЛЕЙЛІСТ -->
    <div id="playlist-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center backdrop-blur-sm">
        <div class="bg-tg-panel w-80 rounded-2xl overflow-hidden shadow-2xl border border-white/10">
            <div class="p-4 border-b border-black/30 flex justify-between items-center bg-tg-card">
                <span class="font-bold text-sm">Додати трек у плейліст</span>
                <button onclick="closeModal()" class="text-tg-muted hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="modal-playlists-list" class="max-h-64 overflow-y-auto p-2 flex flex-col gap-1">
                <!-- Список плейлістів -->
            </div>
        </div>
    </div>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // --- ВШИТІ ТРЕКИ (ALBLAK 52 ТА ІНШІ) ЩОБ ПРАЦЮВАЛО МИТТЄВО БЕЗ ПОМИЛОК ---
        const STARTER_TRACKS = [
            { id: "kR5M3N7T5B0", title: "+7(952)812", artist: "ALBLAK 52", duration: "2:14", artwork: "https://i.ytimg.com/vi/kR5M3N7T5B0/hqdefault.jpg" },
            { id: "7G83v2h_ePA", title: "YEEI 5", artist: "ALBLAK 52", duration: "2:28", artwork: "https://i.ytimg.com/vi/7G83v2h_ePA/hqdefault.jpg" },
            { id: "r5G2lT6G1x8", title: "Nice To Meet You", artist: "ALBLAK 52", duration: "2:45", artwork: "https://i.ytimg.com/vi/r5G2lT6G1x8/hqdefault.jpg" },
            { id: "p_vB8sF2w2c", title: "Winter Shiettt 2", artist: "ALBLAK 52", duration: "2:31", artwork: "https://i.ytimg.com/vi/p_vB8sF2w2c/hqdefault.jpg" },
            { id: "J3mH6y_sP9Q", title: "M11 (feat. Bushido Zho)", artist: "ALBLAK 52", duration: "2:19", artwork: "https://i.ytimg.com/vi/J3mH6y_sP9Q/hqdefault.jpg" },
            { id: "vC4K1_eR8wM", title: "Lost Angeles", artist: "FRIENDLY THUG 52 NGG", duration: "2:50", artwork: "https://i.ytimg.com/vi/vC4K1_eR8wM/hqdefault.jpg" },
            { id: "O7_xN6b3vY8", title: "AMMO", artist: "FRIENDLY THUG 52 NGG", duration: "2:15", artwork: "https://i.ytimg.com/vi/O7_xN6b3vY8/hqdefault.jpg" },
            { id: "b9lT7c_wX1E", title: "Спокойной ночи", artist: "ALBLAK 52", duration: "2:36", artwork: "https://i.ytimg.com/vi/b9lT7c_wX1E/hqdefault.jpg" },
            { id: "mP3k9_vL2zQ", title: "На чиле", artist: "ALBLAK 52 & Скриптонит", duration: "3:10", artwork: "https://i.ytimg.com/vi/mP3k9_vL2zQ/hqdefault.jpg" },
            { id: "9xK2l_pM4vA", title: "2007", artist: "ALBLAK 52", duration: "2:05", artwork: "https://i.ytimg.com/vi/9xK2l_pM4vA/hqdefault.jpg" }
        ];

        // Глобальні змінні
        let player;
        let isPlayerReady = false;
        let progressTimer;

        let currentDisplayedTracks = [];
        let playingQueue = [];
        let currentTrackIndex = -1;
        let activePlaylistId = 'home';
        let trackToSave = null;

        // Збережені плейлісти в браузері
        let userPlaylists = JSON.parse(localStorage.getItem('tg_spotify_playlists')) || {
            'favs': { name: 'Улюблені треки', icon: 'fa-heart', tracks: [] },
            'car': { name: 'В тачку (Бас)', icon: 'fa-car', tracks: [] }
        };

        // --- 1. ІНІЦІАЛІЗАЦІЯ YOUTUBE ПЛЕЄРА ---
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                playerVars: { 'autoplay': 0, 'controls': 0, 'fs': 0, 'modestbranding': 1 },
                events: {
                    'onReady': () => { isPlayerReady = true; },
                    'onStateChange': onPlayerStateChange,
                    'onError': () => { 
                        // Якщо офіційний кліп заблоковано, автоматично шукаємо аудіо-версію цього треку
                        autoFallbackAudio();
                    }
                }
            });
        }

        window.onload = () => {
            renderSidebarPlaylists();
            loadStarterPack();
        };

        // Завантаження головної сторінки (Стартовий пакет)
        function loadStarterPack() {
            activePlaylistId = 'home';
            renderSidebarPlaylists();
            document.getElementById('page-title').innerText = '🔥 ALBLAK 52 & Свіжі Хіти';
            currentDisplayedTracks = [...STARTER_TRACKS];
            renderGrid(currentDisplayedTracks);
            // Також фоново довантажимо свіжі треки ALBLAK 52
            quickSearch('ALBLAK 52 треки', true);
        }

        // --- 2. НАДІЙНИЙ ПОШУК МУЗИКИ НАПРЯМУ З YOUTUBE (БЕЗ ПАДІННЯ СЕРВЕРІВ) ---
        async function quickSearch(query, silent = false) {
            document.getElementById('search-input').value = query;
            await searchMusic(silent);
        }

        async function searchMusic(silent = false) {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;

            if (!silent) {
                activePlaylistId = 'search';
                renderSidebarPlaylists();
                document.getElementById('page-title').innerText = `🔍 Результати: "${query}"`;
                showLoader(true);
            }

            // Додаємо слово "audio", щоб YouTube видавав треки без вікових обмежень і блокувань
            const searchQuery = query + " official audio";
            let tracks = [];

            // Метод 1: Прямий парсинг YouTube через AllOrigins Proxy (Працює у 99% випадків)
            try {
                const ytUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(searchQuery)}`;
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(ytUrl)}`;
                
                const res = await fetch(proxyUrl);
                const data = await res.json();
                
                if (data.contents) {
                    const match = data.contents.match(/var ytInitialData = (\{.*?\});<\/script>/);
                    if (match && match[1]) {
                        const ytData = JSON.parse(match[1]);
                        const contents = ytData.contents?.twoColumnSearchResultsRenderer?.primaryContents?.sectionListRenderer?.contents[0]?.itemSectionRenderer?.contents;
                        
                        if (contents) {
                            contents.forEach(item => {
                                const v = item.videoRenderer;
                                if (v && v.videoId && v.lengthText) {
                                    tracks.push({
                                        id: v.videoId,
                                        title: v.title.runs[0].text,
                                        artist: v.ownerText.runs[0].text.replace(' - Topic', ''),
                                        duration: v.lengthText.simpleText,
                                        artwork: `https://i.ytimg.com/vi/${v.videoId}/hqdefault.jpg`
                                    });
                                }
                            });
                        }
                    }
                }
            } catch (e) {
                console.warn("Метод 1 не спрацював, пробуємо резервний...", e);
            }

            // Метод 2 (Резервний): Якщо проксі затримався, беремо Invidious API
            if (tracks.length === 0) {
                const backupApis = [
                    'https://inv.tux.pizza/api/v1/search',
                    'https://invidious.nerdvpn.de/api/v1/search',
                    'https://invidious.flokinet.to/api/v1/search'
                ];
                for (const api of backupApis) {
                    try {
                        const res = await fetch(`${api}?q=${encodeURIComponent(searchQuery)}&type=video`);
                        if (res.ok) {
                            const items = await res.json();
                            tracks = items.filter(i => i.lengthSeconds > 0).map(i => ({
                                id: i.videoId,
                                title: i.title,
                                artist: i.author.replace(' - Topic', ''),
                                duration: formatTime(i.lengthSeconds),
                                artwork: `https://i.ytimg.com/vi/${i.videoId}/hqdefault.jpg`
                            }));
                            if (tracks.length > 0) break;
                        }
                    } catch (e) {}
                }
            }

            showLoader(false);

            if (tracks.length > 0) {
                currentDisplayedTracks = tracks;
                renderGrid(currentDisplayedTracks);
            } else if (!silent) {
                // Якщо взагалі немає інтернету, показуємо стартовий пакет
                alert("Не вдалося з'єднатися з пошуком, показую базові треки.");
                loadStarterPack();
            }
        }

        // --- 3. ВІДОБРАЖЕННЯ КАРТОК ЯК У SPOTIFY ---
        function renderGrid(tracks) {
            const grid = document.getElementById('tracks-grid');
            const countTxt = document.getElementById('tracks-count');
            grid.innerHTML = '';
            countTxt.innerText = `${tracks.length} треків`;

            if (tracks.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-16 text-tg-muted">У цьому плейлісті поки порожньо. Знайдіть музику через пошук і натисніть <b>+</b> на картці!</div>`;
                return;
            }

            tracks.forEach((track, index) => {
                const isPlaying = playingQueue[currentTrackIndex]?.id === track.id;
                const activeClass = isPlaying ? 'playing-glow bg-tg-cardHover' : 'bg-tg-card hover:bg-tg-cardHover';
                const playIcon = (isPlaying && player?.getPlayerState() === 1) ? 'fa-pause' : 'fa-play ml-0.5';

                // Кнопка видалення (якщо ми всередині власного плейліста)
                const isCustomPlaylist = userPlaylists[activePlaylistId] !== undefined;
                const actionBtn = isCustomPlaylist 
                    ? `<button onclick="removeFromPlaylist('${track.id}')" title="Видалити з плейліста" class="text-tg-muted hover:text-red-400 transition"><i class="fa-solid fa-trash-can"></i></button>`
                    : `<button onclick="openPlaylistModal(${index})" title="Додати в плейліст" class="text-tg-muted hover:text-tg-accent transition"><i class="fa-solid fa-circle-plus text-lg"></i></button>`;

                const card = document.createElement('div');
                card.className = `${activeClass} p-4 rounded-xl transition duration-200 group flex flex-col relative`;
                card.innerHTML = `
                    <div class="relative mb-3 overflow-hidden rounded-lg aspect-square bg-tg-bg shadow-md">
                        <img src="${track.artwork}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        
                        <!-- Кругла кнопка Play у стилі Spotify, але блакитна як в ТГ -->
                        <button onclick="playFromGrid(${index})" class="absolute bottom-2.5 right-2.5 w-12 h-12 bg-tg-accent text-tg-bg rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 translate-y-2 group-hover:translate-y-0 transition-all duration-200 shadow-xl hover:scale-105 hover:bg-white">
                            <i class="fa-solid ${playIcon} text-lg"></i>
                        </button>
                    </div>

                    <div class="font-bold text-sm truncate text-white mb-1" title="${track.title}">${track.title}</div>
                    <div class="text-xs text-tg-muted truncate mb-3">${track.artist}</div>

                    <div class="mt-auto pt-2 border-t border-white/5 flex items-center justify-between text-xs text-tg-muted">
                        <span><i class="fa-regular fa-clock mr-1"></i>${track.duration}</span>
                        ${actionBtn}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // --- 4. ЛОГІКА ПЛЕЄРА ---
        function playFromGrid(index) {
            if (!isPlayerReady) return alert("Плеєр ініціалізується, зачекайте секунду...");

            const clickedTrack = currentDisplayedTracks[index];
            if (playingQueue[currentTrackIndex]?.id === clickedTrack.id) {
                togglePlay();
                return;
            }

            playingQueue = [...currentDisplayedTracks];
            currentTrackIndex = index;
            loadAndPlayCurrent();
        }

        function loadAndPlayCurrent() {
            const track = playingQueue[currentTrackIndex];
            if (!track) return;

            player.loadVideoById(track.id);

            document.getElementById('player-title').innerText = track.title;
            document.getElementById('player-artist').innerText = track.artist;
            document.getElementById('player-art').src = track.artwork;

            renderGrid(currentDisplayedTracks);
        }

        // Якщо кліп заблоковано власником для вбудовування, автоматично шукаємо аудіо-копію
        async function autoFallbackAudio() {
            const track = playingQueue[currentTrackIndex];
            if (!track || track.retried) {
                nextTrack();
                return;
            }
            track.retried = true;
            document.getElementById('player-title').innerText = `Завантаження аудіо: ${track.title}...`;
            
            try {
                const q = `${track.artist} ${track.title} audio lyrics`;
                const ytUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(q)}`;
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(ytUrl)}`);
                const data = await res.json();
                const match = data.contents.match(/"videoId":"([a-zA-Z0-9_-]{11})"/g);
                if (match && match.length > 1) {
                    // Беремо друге відео у списку (зазвичай це чисте аудіо без блокувань)
                    const newId = match[1].split('"')[3];
                    track.id = newId;
                    player.loadVideoById(newId);
                } else {
                    nextTrack();
                }
            } catch (e) {
                nextTrack();
            }
        }

        function togglePlay() {
            if (!player || currentTrackIndex === -1) return;
            const state = player.getPlayerState();
            if (state === 1) player.pauseVideo();
            else player.playVideo();
        }

        function onPlayerStateChange(event) {
            const playBtn = document.getElementById('play-btn');
            if (event.data === YT.PlayerState.PLAYING) {
                playBtn.innerHTML = '<i class="fa-solid fa-pause text-base"></i>';
                startTimer();
            } else {
                playBtn.innerHTML = '<i class="fa-solid fa-play ml-0.5 text-base"></i>';
                clearInterval(progressTimer);
            }

            if (event.data === YT.PlayerState.ENDED) {
                nextTrack();
            }
            renderGrid(currentDisplayedTracks);
        }

        function nextTrack() {
            if (currentTrackIndex < playingQueue.length - 1) {
                currentTrackIndex++;
                loadAndPlayCurrent();
            }
        }

        function prevTrack() {
            if (currentTrackIndex > 0) {
                currentTrackIndex--;
                loadAndPlayCurrent();
            }
        }

        function startTimer() {
            clearInterval(progressTimer);
            progressTimer = setInterval(() => {
                const cur = player.getCurrentTime();
                const dur = player.getDuration();
                if (dur > 0) {
                    document.getElementById('progress-bar').value = (cur / dur) * 100;
                    document.getElementById('current-time').innerText = formatTime(cur);
                    document.getElementById('duration-time').innerText = formatTime(dur);
                }
            }, 1000);
        }

        function seekTrack() {
            const val = document.getElementById('progress-bar').value;
            const dur = player.getDuration();
            if (dur) player.seekTo((val / 100) * dur, true);
        }

        function changeVolume() {
            player.setVolume(document.getElementById('volume-bar').value);
        }

        // --- 5. РОБОТА З ПЛЕЙЛІСТАМИ ---
        function renderSidebarPlaylists() {
            const container = document.getElementById('playlists-list');
            const homeBtn = document.getElementById('nav-home');
            
            homeBtn.className = activePlaylistId === 'home' 
                ? 'flex items-center gap-4 px-4 py-3 rounded-lg text-sm font-semibold bg-tg-active text-white transition'
                : 'flex items-center gap-4 px-4 py-3 rounded-lg text-sm font-medium text-tg-muted hover:text-white hover:bg-tg-cardHover transition';

            container.innerHTML = '';

            for (const [id, pl] of Object.entries(userPlaylists)) {
                const isActive = activePlaylistId === id;
                const btnClass = isActive 
                    ? 'bg-tg-active text-white font-semibold' 
                    : 'text-tg-muted hover:text-white hover:bg-tg-cardHover font-medium';

                container.innerHTML += `
                    <button onclick="openPlaylist('${id}')" class="flex items-center justify-between px-4 py-2.5 rounded-lg text-sm transition ${btnClass}">
                        <div class="flex items-center gap-3 truncate">
                            <i class="fa-solid ${pl.icon} text-tg-accent w-4"></i>
                            <span class="truncate">${pl.name}</span>
                        </div>
                        <span class="text-xs opacity-60">${pl.tracks.length}</span>
                    </button>
                `;
            }
        }

        function createNewPlaylist() {
            const name = prompt("Введіть назву нового плейліста:");
            if (!name || !name.trim()) return;

            const id = 'pl_' + Date.now();
            userPlaylists[id] = {
                name: name.trim(),
                icon: 'fa-music',
                tracks: []
            };
            savePlaylists();
            openPlaylist(id);
        }

        function openPlaylist(id) {
            activePlaylistId = id;
            renderSidebarPlaylists();
            const pl = userPlaylists[id];
            document.getElementById('page-title').innerText = `📁 ${pl.name}`;
            currentDisplayedTracks = [...pl.tracks];
            renderGrid(currentDisplayedTracks);
        }

        function openPlaylistModal(trackIndex) {
            trackToSave = currentDisplayedTracks[trackIndex];
            const modal = document.getElementById('playlist-modal');
            const list = document.getElementById('modal-playlists-list');
            list.innerHTML = '';

            for (const [id, pl] of Object.entries(userPlaylists)) {
                list.innerHTML += `
                    <button onclick="addTrackToPlaylist('${id}')" class="flex items-center justify-between p-3 rounded-xl hover:bg-tg-cardHover text-left transition">
                        <div class="flex items-center gap-3">
                            <i class="fa-solid ${pl.icon} text-tg-accent"></i>
                            <span class="text-sm font-medium">${pl.name}</span>
                        </div>
                        <span class="text-xs text-tg-muted">${pl.tracks.length} треків</span>
                    </button>
                `;
            }
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('playlist-modal').classList.add('hidden');
            trackToSave = null;
        }

        function addTrackToPlaylist(playlistId) {
            if (!trackToSave) return;
            const list = userPlaylists[playlistId].tracks;
            if (!list.some(t => t.id === trackToSave.id)) {
                list.unshift(trackToSave);
                savePlaylists();
                renderSidebarPlaylists();
            }
            closeModal();
        }

        function removeFromPlaylist(trackId) {
            if (userPlaylists[activePlaylistId]) {
                userPlaylists[activePlaylistId].tracks = userPlaylists[activePlaylistId].tracks.filter(t => t.id !== trackId);
                savePlaylists();
                openPlaylist(activePlaylistId);
            }
        }

        function savePlaylists() {
            localStorage.setItem('tg_spotify_playlists', JSON.stringify(userPlaylists));
        }

        // --- ДОПОМІЖНІ ФУНКЦІЇ ---
        function formatTime(sec) {
            sec = Math.floor(sec || 0);
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function showLoader(show) {
            document.getElementById('loader').classList.toggle('hidden', !show);
            document.getElementById('tracks-grid').classList.toggle('hidden', show);
        }
    </script>
</body>
</html>
